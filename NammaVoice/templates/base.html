<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NammaVoice</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><a class="brand" href="/">🎙️ NammaVoice</a><nav><a href="/">Register</a><a href="/track">Track</a><a href="/admin">Admin</a></nav></header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert {{category}}">{{message}}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>NammaVoice · Student prototype · Not connected to a government department</footer>
</body></html>
